app = "just-an-automated-pantry"
primary_region = "sin"

[build]

[env]
  PORT = "8080"
  DATA_DIR = "/data"
  PUBLIC_URL = "https://just-an-automated-pantry.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # SQLite lives on a single attached volume, so exactly one machine may run.
  min_machines_running = 0
  max_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[mounts]
  source = "pantry_data"
  destination = "/data"

# One machine holds the volume, so replace it rather than trying to run two at once.
[deploy]
  strategy = "immediate"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
